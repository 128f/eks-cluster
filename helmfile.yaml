# helmfile.yaml
repositories:
  # - name: nvdp
  #   url: https://nvidia.github.io/k8s-device-plugin
  - name: eks-charts
    url: https://aws.github.io/eks-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:

  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks-charts/aws-load-balancer-controller
    values:
      - manifests/aws-load-balancer-controller-values.yaml

  - name: kube-prometheus-stack
    namespace: monitoring
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    values:
      - grafana:
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki-gateway.monitoring.svc.cluster.local
              access: proxy

  # Log storage - single-binary mode with local filesystem storage, sized for a demo cluster
  - name: loki
    namespace: monitoring
    createNamespace: true
    chart: grafana/loki
    needs:
      - monitoring/kube-prometheus-stack
    values:
      - deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          persistence:
            storageClass: gp2
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        minio:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

  # Log shipper - tails pod logs via the Kubernetes API (no hostPath mount needed) and forwards to Loki
  - name: alloy
    namespace: monitoring
    createNamespace: true
    chart: grafana/alloy
    needs:
      - monitoring/loki
    values:
      - alloy:
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
                }
              }



